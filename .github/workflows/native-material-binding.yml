name: Native material binding mock

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Windows material binding mock
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install compiler
        run: python -m pip install ziglang==0.13.0
      - name: Native assertions and negative NDEBUG build
        run: python -c "import pathlib, subprocess, sys, ziglang; subprocess.check_call([sys.executable, 'experiments/material_binding/build_offline.py', '--compiler', str(pathlib.Path(ziglang.__file__).parent / 'zig.exe'), '--out', 'reports/material-binding-ci'])"
      - name: Upload synthetic summary only
        uses: actions/upload-artifact@v4
        with:
          name: material-binding-mock
          path: reports/material-binding-ci/results.json
