name: Offline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-mocks:
    name: Windows native ownership mocks
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned standalone compiler
        run: python -m pip install ziglang==0.13.0
      - name: Run assertion sentinel and native mocks without a game
        run: python -c "import pathlib, subprocess, sys, ziglang; subprocess.check_call([sys.executable, 'experiments/private_snapshot/build_offline.py', '--compiler', str(pathlib.Path(ziglang.__file__).parent / 'zig.exe'), '--out', 'reports/native-ci'])"
      - name: Upload synthetic native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ownership-mocks
          path: reports/native-ci/results.json
          if-no-files-found: ignore
  offline:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build and test tools
        run: python -m pip install ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Build source and wheel distributions
        run: python -m build
      - name: Install built wheel
        run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', glob.glob('dist/*.whl')[0]])"
      - name: Pytest against installed package
        run: python -m pytest --cov=kenshi_test --cov-report=term-missing --cov-report=xml --cov-fail-under=85 --junitxml=junit.xml
      - name: Acceptance commands without a game
        run: python scripts/smoke.py
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-tests-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            junit.xml
            coverage.xml
          if-no-files-found: ignore
